apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: notification-service
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cpu-throttling: "false"
    spec:
      serviceAccountName: notification-runtime@petspotr.iam.gserviceaccount.com
      containers:
        - image: gcr.io/petspotr/notification-service:latest
          env:
            - name: PUBSUB_PUSH_SUBSCRIPTION
              value: projects/petspotr/subscriptions/match-found-notification-backlog
            - name: PUBSUB_PUSH_SERVICE_ACCOUNT
              value: pubsub-notification-invoker@petspotr.iam.gserviceaccount.com
            - name: PUBSUB_LOST_SUBSCRIPTION
              value: projects/petspotr/subscriptions/lost-pet-notification
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
