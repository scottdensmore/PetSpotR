apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: web-frontend
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    spec:
      serviceAccountName: web-frontend-runtime@petspotr.iam.gserviceaccount.com
      containers:
        - image: gcr.io/petspotr/web-frontend:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
