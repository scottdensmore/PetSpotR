apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: lostpet-service
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    spec:
      containers:
        - image: gcr.io/petspotr/lostpet-service:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
