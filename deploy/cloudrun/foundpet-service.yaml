apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: foundpet-service
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cpu-throttling: "false"
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "1"
    spec:
      serviceAccountName: foundpet-runtime@petspotr.iam.gserviceaccount.com
      containers:
        - image: gcr.io/petspotr/foundpet-service:latest
          env:
            - name: PETSPOTR_IMAGE_BUCKET
              value: petspotr-pet-images
          ports:
            - containerPort: 8081
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
