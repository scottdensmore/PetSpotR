name: Go build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      approved_head:
        description: Exact final PR head approved for Docker validation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOENV: 'off'
      GOOGLE_APPLICATION_CREDENTIALS: /nonexistent/ci-no-cloud-credentials.json
      GCE_METADATA_HOST: 127.0.0.1:9
      FIRESTORE_EMULATOR_HOST: ''
      PUBSUB_EMULATOR_HOST: ''
      FIREBASE_AUTH_EMULATOR_HOST: ''
      PETSPOTR_GCS_INTEGRATION_BUCKET: ''
      GO_INTEGRATION_OLLAMA: ''
      SENDGRID_API_KEY: ''
      TWILIO_ACCOUNT_SID: ''
      TWILIO_AUTH_TOKEN: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select existing Go without a toolchain download
        run: |
          set -euo pipefail
          go_bin="$(find "$RUNNER_TOOL_CACHE/go" -mindepth 3 -maxdepth 3 -type d -path '*/x64/bin' | sort -V | tail -1)"
          test -n "$go_bin"
          test -x "$go_bin/go"
          "$go_bin/go" version
          "$go_bin/go" list -m
          echo "$go_bin" >> "$GITHUB_PATH"
      - name: Test Docker validation image selection
        run: /usr/bin/python3 -m unittest discover -s scripts -p test_docker_validation.py -v
      - name: Fetch and verify only locked project modules
        run: |
          go mod download
          go mod verify
      - name: Vet and compile every package
        run: |
          set -euo pipefail
          go vet ./...
          go build ./...
      - name: Run the complete default suite with race detection and coverage
        run: |
          set -euo pipefail
          go test -race -json -coverprofile="$RUNNER_TEMP/coverage.out" ./... | tee "$RUNNER_TEMP/go-tests.jsonl"
          go tool cover -func="$RUNNER_TEMP/coverage.out" | tail -1
          python3 -I - "$RUNNER_TEMP/go-tests.jsonl" <<'PYCODE'
          import collections, json, sys
          counts = collections.Counter()
          skipped = []
          with open(sys.argv[1]) as events:
              for line in events:
                  event = json.loads(line)
                  if event.get("Test") and event.get("Action") in ("pass", "fail", "skip"):
                      counts[event["Action"]] += 1
                      if event["Action"] == "skip":
                          skipped.append(event["Package"] + "/" + event["Test"])
          print("Actual test/subtest outcomes:", dict(counts))
          print("Existing opt-in tests not executed:")
          print("\n".join(skipped))
          PYCODE
      - name: Verify tracked source and module locks were preserved
        run: git diff --quiet --exit-code
      - name: Retain failure diagnostics only
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: go-failure-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/go-tests.jsonl
            ${{ runner.temp }}/coverage.out
          retention-days: 3

  docker-build:
    if: github.event_name == 'workflow_dispatch' && inputs.approved_head != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
    strategy:
      fail-fast: false
      matrix:
        service: [web-frontend, lostpet-service, foundpet-service, pet-matcher, notification-service]
    steps:
      - name: Confirm dispatch selects the exact approved workflow head
        env:
          APPROVED_HEAD: ${{ inputs.approved_head }}
        run: |
          [[ "$APPROVED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$APPROVED_HEAD"
          for tool in /usr/bin/docker /usr/bin/python3 /usr/bin/git /usr/bin/file /usr/bin/grep /usr/bin/tee /usr/bin/cat; do
            test -x "$tool"
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.approved_head }}
          persist-credentials: false
      - name: Confirm checked-out head
        env:
          APPROVED_HEAD: ${{ inputs.approved_head }}
        run: test "$(/usr/bin/git rev-parse HEAD)" = "$APPROVED_HEAD"
      - name: Read base-image versions from the tracked Dockerfile
        run: /usr/bin/python3 scripts/docker_validation.py refs --dockerfile Dockerfile --env-file "$GITHUB_ENV"
      - name: Pull and record resolved base-image digests and platforms
        run: |
          /usr/bin/docker pull --platform linux/amd64 "$BUILDER_TAG"
          /usr/bin/docker pull --platform linux/amd64 "$RUNTIME_TAG"
          /usr/bin/docker image inspect "$BUILDER_TAG" "$RUNTIME_TAG" > "$RUNNER_TEMP/base-images.json"
          /usr/bin/python3 scripts/docker_validation.py pin --dockerfile Dockerfile \
            --images "$RUNNER_TEMP/base-images.json" --output "$RUNNER_TEMP/Dockerfile.validation" \
            --head "$GITHUB_SHA" > "$RUNNER_TEMP/base-image-records.json"
          printf 'PETSPOTR_BASE_IMAGE_RECORD_BEGIN\n'
          /usr/bin/cat "$RUNNER_TEMP/base-image-records.json"
          printf '\nPETSPOTR_BASE_IMAGE_RECORD_END\n'
          {
            printf '### Resolved base images\n```json\n'
            /usr/bin/cat "$RUNNER_TEMP/base-image-records.json"
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build production service image from recorded immutable bases
        env:
          SERVICE_NAME: ${{ matrix.service }}
        run: |
          /usr/bin/docker build --pull --platform linux/amd64 \
            --file "$RUNNER_TEMP/Dockerfile.validation" \
            --build-arg "SERVICE_NAME=$SERVICE_NAME" \
            --tag "petspotr-validation:$SERVICE_NAME" .
      - name: Check runtime metadata and static Linux binary without starting it
        env:
          SERVICE_NAME: ${{ matrix.service }}
        run: |
          /usr/bin/docker image inspect "petspotr-validation:$SERVICE_NAME" > "$RUNNER_TEMP/image.json"
          /usr/bin/python3 -I - "$RUNNER_TEMP/image.json" <<'PYCODE'
          import json, sys
          image = json.load(open(sys.argv[1]))[0]
          config = image["Config"]
          assert image["Os"] == "linux" and image["Architecture"] == "amd64"
          assert config["User"] == "nonroot:nonroot", config["User"]
          assert config["Entrypoint"] == ["/server"], config["Entrypoint"]
          print("PETSPOTR_BUILT_IMAGE_RECORD " + json.dumps({
              "image_id": image["Id"], "os": image["Os"],
              "architecture": image["Architecture"], "config": config,
          }))
          PYCODE
          container_id=$(/usr/bin/docker create --network none "petspotr-validation:$SERVICE_NAME")
          trap '/usr/bin/docker rm "$container_id"' EXIT
          /usr/bin/docker cp "$container_id:/server" "$RUNNER_TEMP/server"
          /usr/bin/file "$RUNNER_TEMP/server" | /usr/bin/tee "$RUNNER_TEMP/binary-format.txt"
          /usr/bin/grep -q 'ELF 64-bit.*statically linked' "$RUNNER_TEMP/binary-format.txt"
          /usr/bin/cat "$RUNNER_TEMP/binary-format.txt" >> "$GITHUB_STEP_SUMMARY"
