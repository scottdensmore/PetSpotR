name: CI & PR Validation

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate Conventional Commit Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  static-checks:
    name: Static Analysis & Markdown Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Run Markdown Linter
        # Pinned, not floating: an unpinned linter turns an unrelated upstream
        # release into a surprise red build. Keep in sync with CLAUDE.md.
        run: |
          npx --yes markdownlint-cli@0.49.1 --config .markdownlint.json \
            "AGENTS.md" "CLAUDE.md" "README.md" "docs/**/*.md"

  go-checks:
    name: Go Build & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Go module
        id: check_go
        run: |
          if [ -f "go.mod" ]; then
            echo "has_go=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_go=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        if: steps.check_go.outputs.has_go == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Go Vet
        if: steps.check_go.outputs.has_go == 'true'
        run: go vet ./...

      - name: Go Test (race + coverage)
        if: steps.check_go.outputs.has_go == 'true'
        run: go test -race -cover ./...

      - name: Lint
        if: steps.check_go.outputs.has_go == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, not "latest": .golangci.yml uses the v2 schema, which
          # golangci-lint v1 cannot parse. Keep this in sync with the version
          # the verifier runs locally.
          version: v2.12.2

  infra-checks:
    name: OpenTofu Format & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          # Pinned so `tofu fmt` rules cannot shift under us on an upstream
          # release. Keep in sync with CLAUDE.md.
          tofu_version: 1.12.5

      - name: Format Check
        working-directory: infra/opentofu
        run: tofu fmt -check -recursive

      - name: Validate
        working-directory: infra/opentofu
        run: |
          tofu init -backend=false
          tofu validate
