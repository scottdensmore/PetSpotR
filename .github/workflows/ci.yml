name: CI & PR Validation

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate Conventional Commit Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  static-checks:
    name: Static Analysis & Markdown Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Active LTS. Keep in sync with AGENTS.md; docs_test.go asserts both
          # setup-node steps agree with each other and with the doc.
          node-version: 24

      - name: Install & Run Markdown Linter
        # Pinned, not floating: an unpinned linter turns an unrelated upstream
        # release into a surprise red build. Keep in sync with AGENTS.md.
        run: |
          npx --yes markdownlint-cli@0.49.1 --config .markdownlint.json \
            "AGENTS.md" "CLAUDE.md" "README.md" "docs/**/*.md"

  go-checks:
    name: Go Build & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # No `if: hashFiles('go.mod')` guard here. This job is a required check,
      # and a guarded job reports success while running nothing — so losing or
      # renaming go.mod would silently retire vet, test, and lint instead of
      # failing loudly. If the module layout changes, this job should break.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Exact patch pin, not '1.26': go vet's analyzer set and stdlib
          # behavior shift between releases, so a floating toolchain can turn a
          # green local verifier run red here. Keep in sync with AGENTS.md.
          go-version: '1.26.5'

      - name: Go Vet
        run: go vet ./...

      - name: Go Test (race + coverage)
        run: go test -race -cover ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, not "latest": .golangci.yml uses the v2 schema, which
          # golangci-lint v1 cannot parse. Keep in sync with AGENTS.md.
          version: v2.12.2

  e2e-playwright-tests:
    name: Playwright API Journeys
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Active LTS. Keep in sync with AGENTS.md; docs_test.go asserts both
          # setup-node steps agree with each other and with the doc.
          node-version: 24
          cache: npm
          cache-dependency-path: tests/playwright/package-lock.json

      - name: Start API Services
        run: docker compose up --build --detach lostpet-service foundpet-service web-frontend

      - name: Wait for API Services
        shell: bash
        run: |
          endpoints=(
            "http://localhost:8080/lostPet"
            "http://localhost:8081/foundPet"
            "http://localhost:8082/healthz"
          )

          for endpoint in "${endpoints[@]}"; do
            ready=false
            for attempt in {1..30}; do
              if curl --silent --show-error --output /dev/null "$endpoint"; then
                ready=true
                break
              fi
              sleep 2
            done

            if [[ "$ready" != "true" ]]; then
              echo "::error::Service did not become ready at $endpoint"
              docker compose logs
              exit 1
            fi
          done

      - name: Install Playwright Dependencies & Browsers
        working-directory: tests/playwright
        run: |
          npm ci
          npx playwright install chromium

      - name: Run Playwright API Journeys
        working-directory: tests/playwright
        env:
          LOSTPET_SERVICE_URL: http://localhost:8080
          FOUNDPET_SERVICE_URL: http://localhost:8081
          WEB_FRONTEND_URL: http://localhost:8082
        run: npx playwright test

      - name: Capture Service Logs
        if: failure()
        run: docker compose logs --no-color > compose.log

      - name: Upload Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-api-journey-failure
          path: |
            tests/playwright/playwright-report/
            tests/playwright/test-results/
            compose.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop API Services
        if: always()
        run: docker compose down --volumes --remove-orphans

  infra-checks:
    name: OpenTofu Format & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          # Pinned so `tofu fmt` rules cannot shift under us on an upstream
          # release. Keep in sync with AGENTS.md.
          tofu_version: 1.12.5

      - name: Format Check
        working-directory: infra/opentofu
        run: tofu fmt -check -recursive

      - name: Validate
        working-directory: infra/opentofu
        run: |
          tofu init -backend=false
          tofu validate
