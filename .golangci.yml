version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - misspell

  exclusions:
    rules:
      - path: (_test\.go|^e2e/)
        linters:
          - errcheck
          - bodyclose

formatters:
  enable:
    - gofmt
