version: '3.8'

services:
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-0.32.5}
    container_name: petspotr-ollama
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  ollama-init:
    image: ollama/ollama:${OLLAMA_VERSION:-0.32.5}
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama
    command: ["pull", "${OLLAMA_MODEL:-gemma4:e2b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  lostpet-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: lostpet-service
    container_name: petspotr-lostpet-service
    ports:
      - "8080:8080"
    environment:
      - PORT=8080

  foundpet-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: foundpet-service
    container_name: petspotr-foundpet-service
    ports:
      - "8081:8081"
    environment:
      - PORT=8081

  pet-matcher:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: pet-matcher
    container_name: petspotr-pet-matcher
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4:e2b}
      - PUBSUB_PUSH_SUBSCRIPTION=projects/petspotr-local/subscriptions/found-pet-matcher
      - PUBSUB_PUSH_DEV_TOKEN=${PUBSUB_PUSH_DEV_TOKEN:-petspotr-local-push}
    depends_on:
      ollama-init:
        condition: service_completed_successfully

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: notification-service
    container_name: petspotr-notification-service
    ports:
      - "8084:8084"
    environment:
      - PORT=8084
      - PUBSUB_PUSH_SUBSCRIPTION=projects/petspotr-local/subscriptions/match-found-notification-backlog
      - PUBSUB_LOST_SUBSCRIPTION=projects/petspotr-local/subscriptions/lost-pet-notification
      - PUBSUB_PUSH_DEV_TOKEN=${PUBSUB_PUSH_DEV_TOKEN:-petspotr-local-push}

  web-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: web-frontend
    container_name: petspotr-web-frontend
    ports:
      - "8082:8082"
    environment:
      - PORT=8082

volumes:
  ollama_data:
